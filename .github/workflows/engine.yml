name: PreBetPro Engine

# Calcola pronostici calcio e tennis ogni 30 minuti e li invia al Worker Cloudflare.
on:
  schedule:
    - cron: "7,37 * * * *"     # ogni 30 minuti
    - cron: "0 4 1 * *"        # keepalive mensile (GitHub sospende i cron dopo 60 giorni senza attività)
  workflow_dispatch:

concurrency:
  group: prebetpro-engine
  cancel-in-progress: false

jobs:
  engine:
    if: github.event.schedule != '0 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - name: Run engine
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKER_URL: https://prebetpro-api.vincenzodiguida.workers.dev
        run: python engine/engine.py

  keepalive:
    if: github.event.schedule == '0 4 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "prebetpro-bot"
          git config user.email "bot@prebetpro.com"
          date -u > engine/.keepalive
          git add engine/.keepalive
          git commit -m "keepalive engine schedule" && git push
